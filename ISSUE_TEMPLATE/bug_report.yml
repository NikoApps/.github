name: Bug report
description: Something doesn't work the way it should.
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe what you did and what went wrong.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the app
        2. Tap ...
        3. ...
  - type: input
    id: app-version
    attributes:
      label: App version
      placeholder: "1.0.0"
  - type: input
    id: device
    attributes:
      label: Phone and Android version
      placeholder: "Samsung Galaxy A15, Android 14"
    validations:
      required: true
  - type: input
    id: language
    attributes:
      label: Phone language
      placeholder: "Nepali"
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Screenshots, screen recordings or battery saver settings help.
