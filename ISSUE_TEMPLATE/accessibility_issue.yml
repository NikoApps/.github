name: Accessibility problem
description: Something is hard or impossible to use with an accessibility tool, large text, or without reading.
labels: ["accessibility"]
body:
  - type: markdown
    attributes:
      value: Accessibility problems are treated as bugs, not feature requests. Thank you for reporting.
  - type: dropdown
    id: tool
    attributes:
      label: What were you using?
      multiple: true
      options:
        - TalkBack or another screen reader
        - Large font or display size
        - Switch Access
        - Voice Access
        - Magnification
        - High contrast or colour correction
        - Using the app without reading
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What was hard?
      description: Describe what you tried to do and where it went wrong. If you were helping someone else, describe what they experienced.
    validations:
      required: true
  - type: input
    id: app
    attributes:
      label: App and version
      placeholder: "Niko Clock 1.0.0"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Phone and Android version
      placeholder: "Xiaomi Redmi 12, Android 13"
  - type: input
    id: language
    attributes:
      label: Phone language and text-to-speech engine
      placeholder: "Hindi, Google Speech Services"
